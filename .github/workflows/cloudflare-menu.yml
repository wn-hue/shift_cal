name: Refresh the Cloudflare meal menu
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-menu.yml'
      - 'scripts/publish-cloudflare-meal.cjs'
      - 'api/today-menu.js'
      - 'lib/today-menu.cjs'
      - 'lib/prepared-meal.cjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cloudflare-meal-menu
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/publish-cloudflare-meal.cjs
