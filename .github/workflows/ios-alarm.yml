name: iPhone 근무 자동 알람 검사
on:
  push:
    branches: [main]
    paths: ['ios-alarm/**', 'scripts/export-ios-rules.cjs', 'index.html', '.github/workflows/ios-alarm.yml']
  pull_request:
    paths: ['ios-alarm/**', 'scripts/export-ios-rules.cjs', 'index.html', '.github/workflows/ios-alarm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode와 프로젝트 도구 확인
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: 프로젝트 생성
        working-directory: ios-alarm
        run: xcodegen generate
      - name: 근무별 예약 규칙 검사
        working-directory: ios-alarm
        run: |
          DEVICE_ID=$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"])); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ShiftCalAlarms.xcodeproj -scheme ShiftCalAlarms -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: 실기기용 컴파일 검사
        working-directory: ios-alarm
        run: xcodebuild -project ShiftCalAlarms.xcodeproj -scheme ShiftCalAlarms -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: 프로젝트와 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-cal-iphone-app-project
          path: |
            ios-alarm/ShiftCalAlarms.xcodeproj
            ios-alarm/Generated
            ios-alarm/Sources
            ios-alarm/Tests
            ios-alarm/UITests
            ios-alarm/Release
            ios-alarm/project.yml
            ios-alarm/README.md
            ios-alarm/tests.xcresult
