<!doctype html>
<html lang="ko" data-account-entry>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>이전 기록 가져오기 · 근무 루틴</title>
  <link rel="stylesheet" href="/origin-transfer.css?v=2">
</head>
<body>
  <main>
    <img src="/work-routine-icon.png" alt="">
    <h1 id="title">이전 기록 가져오기</h1>
    <p id="description">근무표와 메모를 어디에 저장했나요?</p>
    <section id="google-transfer" class="card" aria-labelledby="drive-transfer-title">
      <strong id="drive-transfer-title">Google Drive에 저장한 기록</strong>
      <p class="steps">백업할 때 사용한 Google 계정으로 로그인하세요.</p>
      <a id="cloud-login" class="button" href="/api/google-calendar?action=login&amp;storage=1">Google로 기록 불러오기</a>
      <a id="cloud-old-account" class="text-link" target="_blank" rel="noopener" hidden>이전 웹 주소 열기 ↗</a>
    </section>
    <section id="fallback-transfer" class="card" aria-labelledby="device-transfer-title">
      <strong id="device-transfer-title">이전 브라우저에 저장한 기록</strong>
      <p id="device-transfer-steps" class="steps">예전에 쓰던 기기와 브라우저에서 아래 버튼을 누른 뒤, 열린 창에서 ‘복사하기’를 선택하세요.</p>
      <small id="device-transfer-note">이전 기록은 그대로 남고, 새 주소에 이미 있는 항목은 유지해요.</small>
      <div id="source-select-area" hidden>
        <label for="source-select">이전에 사용한 주소</label>
        <select id="source-select" disabled></select>
      </div>
      <button id="transfer" type="button" disabled>이 기기의 기록 가져오기</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry-transfer" type="button" class="secondary" hidden>다시 시도</button>
    <button id="start" type="button" class="secondary" disabled>로그인 화면으로 돌아가기</button>
    <noscript><p>기록을 복사하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <script src="/origin-bridge.js?v=apple-entry-3"></script>
  <script src="/origin-data-core.js"></script>
  <script src="/origin-transfer.js?v=device-copy-2"></script>
</body>
</html>
