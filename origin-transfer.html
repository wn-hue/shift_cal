<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>기존 데이터 가져오기 · 근무 루틴</title><link rel="stylesheet" href="/origin-transfer.css"></head><body><main><img src="/work-routine-icon.png" alt=""><h1 id="title">새 주소에서도<br>그대로 이어서 사용해요</h1><p id="description">기존 기기에 저장된 근무표·메모·시급 설정을 복사해요. 기존 앱의 데이터는 그대로 남아요.</p><section class="card"><button id="transfer">기존 데이터 가져오기</button><button id="start" class="secondary">처음 시작하기</button><div id="file-area"><p>기존 앱에서 저장한 데이터 파일이 있나요?</p><input id="file" type="file" accept="application/json,.json" aria-label="근무 루틴 백업 파일"><label><input id="overwrite" type="checkbox"> 새 주소의 설정과 겹치면 기존 데이터로 바꾸기</label><small>선택하지 않으면 새 주소에 이미 저장한 내용은 덮어쓰지 않아요.</small></div><div id="source-file" hidden><button id="download" class="secondary">데이터 파일로 저장하기</button><a id="new-address" class="button secondary">새 주소 열기</a><small>기존 앱이나 홈 화면에서 열었다면 파일을 저장한 뒤 새 주소에서 불러올 수 있어요. 파일에는 개인 메모와 설정이 포함되므로 본인 기기에 보관해 주세요.</small></div></section><p id="status" role="status" aria-live="polite"></p><small>새 주소에서는 알림 권한을 다시 허용해야 할 수 있어요.</small></main><script src="/origin-data-core.js"></script><script src="/origin-transfer.js"></script></body></html>
