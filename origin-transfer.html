<!doctype html><html lang="ko" data-account-entry><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>기존 데이터 가져오기 · 근무 루틴</title><link rel="stylesheet" href="/origin-transfer.css?v=simple-3"></head><body><main><img src="/work-routine-icon.png" alt=""><h1 id="title">쓰던 기록,<br>그대로 가져오세요</h1><p id="description">근무표·메모·설정을 옮겨요.<br><span class="reassurance">✓ 이전 기록은 그대로 남아요.</span></p><section id="google-transfer" class="card" aria-labelledby="drive-transfer-title"><strong id="drive-transfer-title"><span class="choice-symbol" aria-hidden="true">☁</span>Google 로그인을 했다면</strong><p class="steps">① 같은 Google 계정으로 로그인<br><span aria-hidden="true">　↓</span><br>② Google에 저장한 기록 불러오기</p><a id="cloud-login" class="button" href="/api/google-calendar?action=login&amp;storage=1">Google로 기록 불러오기</a><a id="cloud-old-account" class="text-link" target="_blank" rel="noopener">이전 기록 확인하기 ↗</a><small>※ 기록이 안 나오면 아래 방법을 이용해 주세요.</small></section><section id="fallback-transfer" class="card" aria-labelledby="device-transfer-title"><strong id="device-transfer-title"><span class="choice-symbol" aria-hidden="true">↗</span>Google 로그인을 하지 않았다면</strong><p id="device-transfer-steps" class="steps">① 아래 버튼 누르기<br><span aria-hidden="true">　↓</span><br>② 열린 이전 화면에서 ‘복사하기’ 누르기</p><small id="device-transfer-note">※ 이전에 쓰던 기기와 브라우저에서 진행해 주세요.</small><div id="source-select-area"><label for="source-select">이전에 사용한 주소</label><select id="source-select" disabled style="width:100%;padding:14px;border:1px solid #dce2ea;border-radius:12px;background:#fff;font-size:16px"></select></div><button id="transfer" disabled>이 기기의 기록 가져오기</button><button id="start" disabled class="secondary">처음 시작하기</button></section><p id="status" role="status" aria-live="polite"></p><small>※ 알림을 받으려면 새 주소에서도 알림을 허용해 주세요.</small></main><script src="/origin-bridge.js?v=apple-entry-3"></script><script src="/origin-data-core.js"></script><script src="/origin-transfer.js?v=device-copy-1"></script></body></html>
