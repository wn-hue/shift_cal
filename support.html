<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="근무 루틴에 캔커피 한 잔만큼의 마음을 전하는 선택형 1회 응원이에요.">
<title>캔커피 한 잔 · 근무 루틴</title>
<link rel="canonical" href="https://20261104.xyz/support">
<link rel="icon" href="/work-routine-icon.png">
<link rel="stylesheet" href="/life-feature.css?v=1">
<style>
main { display: grid; gap: 16px; padding: 22px 0 32px; }
.hero, .choices { border-radius: var(--radius); background: var(--surface); padding: clamp(20px, 5.4vw, 30px); }
.hero { display: grid; gap: 16px; align-items: center; grid-template-columns: minmax(0, 1fr) auto; background: #e8f3ff; }
.eyebrow { margin-bottom: 8px; color: var(--blue); font-size: .8125rem; font-weight: 700; }
.hero .intro { max-width: 26em; margin-top: 10px; }
.can { width: clamp(52px, 16vw, 85px); height: auto; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-size: 1.125rem; font-weight: 700; }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-block: 14px 18px; }
.amount { position: relative; }
.amount input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.amount span { display: grid; place-items: center; min-height: 48px; border: 1px solid var(--line); border-radius: var(--control); font-size: clamp(.875rem, 3.9vw, 1rem); font-weight: 650; }
.amount input:checked + span { color: var(--blue); border-color: var(--blue); background: var(--tint); }
.amount input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 3px; }
.pending { display: block; width: 100%; border: 0; border-radius: var(--control); min-height: 48px; padding: 9px 12px; background: var(--page); color: var(--sub); font-weight: 650; cursor: default; }
.note { margin-top: 10px; color: var(--quiet); font-size: .8125rem; text-align: center; line-height: 1.55; }
</style>
</head>
<body>
<header class="top"><div class="shell top-inner">
  <a class="back" href="/#all"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>전체</a>
  <span class="top-title">근무 루틴 응원</span>
  <img class="brand-icon" src="/work-routine-icon.png" width="24" height="24" alt="근무 루틴">
</div></header>
<main class="shell">
  <section class="hero" aria-labelledby="support-title">
    <div>
      <p class="eyebrow">마음이 내킬 때 한 번</p>
      <h1 id="support-title">캔커피 한 잔</h1>
      <p class="intro">교대하는 하루에 근무 루틴이 작은 도움이 됐다면, 캔커피 한 잔만큼의 마음을 전해 주세요. 한 잔이면 충분해요.</p>
    </div>
    <svg class="can" viewBox="0 0 86 108" fill="none" aria-hidden="true">
      <rect x="14" y="11" width="57" height="87" rx="15" fill="#7cb7f8" transform="rotate(9 42 54)"/>
      <rect x="13" y="9" width="54" height="87" rx="14" fill="#246fda" transform="rotate(-8 40 53)"/>
      <path d="m19 29 40-6m-32 58 36-5" stroke="#abd2ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M29 49h20v8a10 10 0 0 1-20 0v-8Zm20 2h3a4 4 0 0 1 0 8h-3m-22 10h25" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M74 7v12m-6-6h12M8 77v8m-4-4h8" stroke="#e49b29" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </section>
  <section class="choices" aria-label="1회 응원">
    <fieldset>
      <legend>한 번 응원하기</legend>
      <div class="options">
        <label class="amount"><input type="radio" name="amount" value="500"><span>500원</span></label>
        <label class="amount"><input type="radio" name="amount" value="1000" checked><span>1,000원</span></label>
        <label class="amount"><input type="radio" name="amount" value="2000"><span>2,000원</span></label>
      </div>
    </fieldset>
    <button type="button" class="pending" disabled aria-describedby="support-note">응원 결제 준비 중</button>
    <p class="note" id="support-note">응원은 선택이에요. 근무 루틴의 기능은 누구나 그대로 쓸 수 있어요.</p>
  </section>
</main>
</body>
</html>
